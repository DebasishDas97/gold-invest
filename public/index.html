<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gold Invest - Invest in gold with ease. Get live prices and make informed decisions.">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira+Stencil+One&display=swap"
    rel="stylesheet">
    <title>Gold Invest</title>
</head>

<body>
    <main>
        <h1 class="title">Gold Invest</h1>
        <img src="gold.png" alt="gold bars and nuggets">
        <section class="price-info-container">
            <p>₹<span id="price-display" class="price" aria-live="assertive">----.--</span> / gram*</p>
            <p id="connection-status" class="status" aria-live="polite">Live Price 🟢</p>
        </section>
        <form>
            <div style="position: relative;">
                <label for="investment-amount">Amount to invest (in ₹)</label>
                <div class="input-container">
                    <div class="currency">₹</div>
                    <input name="investedAmount" type="number" id="investment-amount" placeholder="5000" required>
                </div>
            </div>
            <div style="position: relative;">
                <label for="user-email">Email address</label>
                <div class="input-container">
                    <input name="email" type="email" id="user-email" placeholder="you@example.com" style="border-left: 2px solid var(--gold); border-radius: 10px;" required>
                </div>

            </div>
            <button id="invest-btn" class="invest-btn" aria-label="Invest in gold now">Invest Now!</button>
        </form>
        <!-- This dialog opens after a successful purchase -->
        <dialog class="outputs" role="dialog" aria-labelledby="dialog-title" aria-describedby="investment-summary" lang="en">
            <h2>Summary</h2>
            <p id="investment-summary">You just invested ₹5,000 and bought 0.67 grams of 24K gold. <br> You will receive your PDF receipt shortly in your email.</p>
                <button aria-label="Close dialog and return to main page" autofocus>OK</button>
        </dialog>
        <p class="footnote">* Price quoted in Indian Rupees (INR) per gram of 24 Carat Gold (99.9% purity)</p>
    </main>
    <script type="module" src="index.js"></script>
</body>
</html>
